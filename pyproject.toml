[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zeocreator"
version = "0.5.4"
description = "Provider-neutral continuous editorial and creator operations built on Zeocore"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "ProfRodAI" }]
maintainers = [{ name = "ProfRodAI" }]
keywords = ["creator-operations", "editorial-operations", "newsroom", "zeocore", "pydantic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "zeocore[runtime-host]==0.18.0",
  "pydantic>=2.6.0",
  "rfc8785==0.1.4",
  "typer>=0.27.1",
]

[project.urls]
Homepage = "https://github.com/zeroemployeeorg/zeocreator"
Repository = "https://github.com/zeroemployeeorg/zeocreator"
Documentation = "https://zeroemployeeorg.github.io/zeocreator/"
Issues = "https://github.com/zeroemployeeorg/zeocreator/issues"

[project.scripts]
zeo-creator = "zeo_creator.cli:main"

[dependency-groups]
dev = [
  "mkdocs-material>=9.7.2",
  "mkdocstrings[python]>=1.0.4",
  "pytest>=7.0.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.2.0",
  "mypy>=1.18.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zeo_creator"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/zeo_creator",
  "/LICENSE",
  "/README.md",
  "/CHANGELOG.md",
  "/RELEASE_NOTES.md",
  "/SECURITY.md",
  "/pyproject.toml",
]

[tool.uv]
default-groups = ["dev"]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
extend-exclude = ["src/zeo_creator/reference_artifacts"]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/zeo_creator", "examples"]
