site_name: ZEO Creator
site_description: Provider-neutral creator operations, governed by design.
site_url: https://ducktyper-ai.github.io/dt-creator/
repo_url: https://github.com/ducktyper-ai/dt-creator
repo_name: ducktyper-ai/dt-creator
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Prof Rod · MIT licensed

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            separate_signature: true
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

nav:
  - ZEO Creator: index.md
  - Getting started:
      - Overview: getting-started/index.md
      - Installation: getting-started/installation.md
      - Your first capability: getting-started/first-capability.md
  - Tutorial:
      - Build a content portfolio: tutorials/content-portfolio.md
  - How-to guides:
      - Supply source observations: guides/connectors.md
      - Email marketing: guides/email-marketing.md
      - Shared email receipts: guides/email-receipt-conformance.md
      - Integrate a production engine: guides/production-adapters.md
      - Validate and prepare distribution: guides/delivery-distribution.md
      - Assess performance: guides/performance.md
      - Lint a post thread: guides/thread-lint.md
      - Check length budgets: guides/length-budgets.md
      - Integrate a runner: guides/runner-integration.md
      - Call through Runtime: guides/runtime-host.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Continuous editorial operations: concepts/continuous-editorial-operations.md
      - Contracts and digests: concepts/contracts.md
      - Canonical digest protocol: concepts/canonical-digests.md
  - Reference:
      - Capability catalog: reference/capabilities.md
      - Contract API: reference/contracts.md
      - Error codes: reference/errors.md
      - CLI: reference/cli.md
  - Project:
      - Contributing: contributing.md
      - Zeocore boundary: adr/0001-zeocore-version-and-runtime-boundary.md
      - Runtime host decision: adr/0002-zeocore-runtime-host.md
      - Bounded Zeocore compatibility (proposed): adr/0003-bounded-zeocore-compatibility.md
      - Release readiness: release-readiness.md
      - Legacy removal: removal-report.md
